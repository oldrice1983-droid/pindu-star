name: 构建 IPA（云端，无需 Mac）

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    # 云端 macOS 机器，自带 Xcode —— 这就是你不需要 Mac 的原因。
    # 必须用 macos-26（正式 GA，自带 Xcode 26）：Apple 自 2026-04-28 起要求
    # 提交 App Store Connect 的包必须用 Xcode 26 + iOS 26 SDK 构建，旧版会被拒收。
    runs-on: macos-26

    env:
      # 产出无签名 IPA，签名在你本机用 Sideloadly 做（免费方案）
      CODE_SIGNING_REQUIRED: 'NO'
      CODE_SIGNING_ALLOWED: 'NO'
      CODE_SIGN_IDENTITY: ''
      # Xcode 26 对老部署目标会告警，显式声明避免 Archive 失败
      IPHONEOS_DEPLOYMENT_TARGET: '14.0'

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ios-pack/package-lock.json

      - name: 安装依赖
        working-directory: ios-pack
        run: |
          npm ci || npm install

      - name: 同步 Web 资源到 iOS 工程
        working-directory: ios-pack
        run: npx cap sync ios

      - name: 安装 CocoaPods 依赖
        working-directory: ios-pack/ios/App
        run: |
          # GitHub 的 macOS runner 自带 CocoaPods，一般无需再装
          pod --version || sudo gem install cocoapods
          pod install
          # 兜底：pod install 正常会生成 contents.xcworkspacedata。
          # 若因环境问题缺失，会导致后面 xcodebuild -workspace 找不到工程，这里补上。
          if [ ! -f "App.xcworkspace/contents.xcworkspacedata" ]; then
            echo "workspace 文件缺失，正在补建..."
            cat > "App.xcworkspace/contents.xcworkspacedata" << 'XW'
          <?xml version="1.0" encoding="UTF-8"?>
          <Workspace version = "1.0">
             <FileRef location = "group:App.xcodeproj"></FileRef>
          </Workspace>
          XW
          fi
          test -f "App.xcworkspace/contents.xcworkspacedata" && echo "workspace 就绪"

      - name: 编译打包（Archive）
        working-directory: ios-pack
        run: |
          set -e
          echo "Xcode 版本: $(xcodebuild -version | tr '\n' ' ')"
          # 不依赖 xcpretty（runner 未必预装），直接用原生输出
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_REQUIRED="$CODE_SIGNING_REQUIRED" \
            CODE_SIGNING_ALLOWED="$CODE_SIGNING_ALLOWED" \
            CODE_SIGN_IDENTITY="$CODE_SIGN_IDENTITY" \
            -quiet
          echo "Archive 完成"
          test -d build/App.xcarchive && echo "Archive 产物已生成"

      - name: 从 Archive 提取 IPA
        working-directory: ios-pack
        run: |
          set -e
          mkdir -p build/Payload
          APP_PATH=$(find build/App.xcarchive/Products/Applications -maxdepth 1 -name "*.app" | head -1)
          if [ -z "$APP_PATH" ]; then echo "未找到 .app，请检查上一步编译日志"; exit 1; fi
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -qry "拼读星球-unsigned.ipa" Payload
          echo "--- 产物信息 ---"
          ls -lh "拼读星球-unsigned.ipa"
          echo "--- 应用大小 ---"
          du -sh Payload/*.app

      - name: 上传 IPA 供下载
        uses: actions/upload-artifact@v4
        with:
          name: pindu-star-ipa
          path: ios-pack/build/拼读星球-unsigned.ipa
          retention-days: 90
          if-no-files-found: error

      - name: 输出提示
        run: |
          echo "::notice title=构建成功::请到本页底部 Artifacts 下载 pindu-star-ipa，解压得到 拼读星球-unsigned.ipa，用 Sideloadly 装到 iPhone。"
