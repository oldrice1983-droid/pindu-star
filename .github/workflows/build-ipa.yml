name: 构建 IPA（云端，无需 Mac）

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    # 必须用 macos-26（自带 Xcode 26）。Apple 自 2026-04-28 起要求
    # 提交 App Store Connect 的包必须用 Xcode 26 + iOS 26 SDK 构建。
    runs-on: macos-26

    env:
      # 产出无签名 IPA，签名在你自己电脑上用 Sideloadly 做（免费方案）
      CODE_SIGNING_REQUIRED: 'NO'
      CODE_SIGNING_ALLOWED: 'NO'
      CODE_SIGN_IDENTITY: ''
      IPHONEOS_DEPLOYMENT_TARGET: '14.0'

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          # 仓库根就是 ios-pack 内容，lock 文件就在根目录（勿加 ios-pack/ 前缀）
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 安装依赖
        run: npm ci || npm install

      - name: 同步 Web 资源到 iOS 工程
        run: npx cap sync ios

      - name: 安装 CocoaPods 依赖
        run: |
          # GitHub 的 macOS runner 自带 CocoaPods，一般无需再装
          pod --version || sudo gem install cocoapods
          pod install
          # 兜底：正常 pod install 会生成 contents.xcworkspacedata，
          # 若缺失会导致后面 xcodebuild -workspace 找不到工程
          if [ ! -f "ios/App/App.xcworkspace/contents.xcworkspacedata" ]; then
            echo "workspace file missing, recreating..."
            mkdir -p "ios/App/App.xcworkspace"
            cat > "ios/App/App.xcworkspace/contents.xcworkspacedata" << 'XW'
          <?xml version="1.0" encoding="UTF-8"?>
          <Workspace version = "1.0">
             <FileRef location = "group:App.xcodeproj"></FileRef>
          </Workspace>
          XW
          fi
          test -f "ios/App/App.xcworkspace/contents.xcworkspacedata" && echo "workspace ready"

      - name: 编译打包（Archive）
        run: |
          set -e
          echo "Xcode version:"
          xcodebuild -version
          echo "Deploy target: $IPHONEOS_DEPLOYMENT_TARGET"
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_REQUIRED="$CODE_SIGNING_REQUIRED" \
            CODE_SIGNING_ALLOWED="$CODE_SIGNING_ALLOWED" \
            CODE_SIGN_IDENTITY="$CODE_SIGN_IDENTITY" \
            IPHONEOS_DEPLOYMENT_TARGET="$IPHONEOS_DEPLOYMENT_TARGET" \
            -quiet
          test -d build/App.xcarchive && echo "Archive OK"

      - name: 从 Archive 提取 IPA
        run: |
          set -e
          mkdir -p build/Payload
          APP_PATH=$(find build/App.xcarchive/Products/Applications -maxdepth 1 -name "*.app" | head -1)
          if [ -z "$APP_PATH" ]; then echo "No .app found"; exit 1; fi
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -qry pindu-star-unsigned.ipa Payload
          echo "--- artifact ---"
          ls -lh pindu-star-unsigned.ipa

      - name: 上传 IPA 供下载
        uses: actions/upload-artifact@v4
        with:
          name: pindu-star-ipa
          path: build/pindu-star-unsigned.ipa
          retention-days: 90
          if-no-files-found: error

      - name: 输出提示
        run: |
          echo "::notice title=构建成功::下载 Artifacts 里的 pindu-star-ipa，解压得到 pindu-star-unsigned.ipa，用 Sideloadly 装到 iPhone。"
