name: 构建 IPA（云端，无需 Mac）

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    # 必须用 macos-26（自带 Xcode 26）。Apple 自 2026-04-28 起要求
    # 提交 App Store Connect 的包必须用 Xcode 26 + iOS 26 SDK 构建。
    # 若 macos-26 排队过久，可改 macos-15（Xcode 16，仅影响上传 App Store，不影响本流程）。
    runs-on: macos-26

    env:
      CODE_SIGNING_REQUIRED: 'NO'
      CODE_SIGNING_ALLOWED: 'NO'
      CODE_SIGN_IDENTITY: ''
      IPHONEOS_DEPLOYMENT_TARGET: '14.0'

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 运行环境信息
        run: |
          echo "---------------------------------------------"
          echo "RUNNER_OS   : $RUNNER_OS"
          echo "RUNNER_ARCH : $RUNNER_ARCH"
          echo "GITHUB_SHA  : $GITHUB_SHA"
          echo "NODE        : $(node -v 2>/dev/null || echo none)"
          echo "RUBY        : $(ruby -v 2>/dev/null || echo none)"
          echo "POD         : $(pod --version 2>/dev/null || echo none)"
          echo "GIT         : $(git --version 2>/dev/null || echo none)"
          echo "---------------------------------------------"

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 安装依赖
        run: |
          set -e
          npm ci || npm install
          echo "node_modules size:"
          du -sh node_modules

      - name: 同步 Web 资源到 iOS 工程
        run: |
          set -e
          npx cap sync ios
          echo "public mp3 count:"
          find ios/App/App/public -name "*.mp3" | wc -l

      - name: 安装 CocoaPods
        run: |
          set -e
          if ! command -v pod >/dev/null 2>&1; then
            echo "pod not found, installing via Homebrew..."
            brew install cocoapods
          fi
          pod --version

      - name: pod install
        working-directory: ios/App
        run: |
          set -e
          pod install --repo-update
          if [ ! -f "App.xcworkspace/contents.xcworkspacedata" ]; then
            echo "ERROR: workspace file still missing after pod install"
            exit 1
          fi
          echo "workspace OK"

      - name: 编译打包（Archive）
        run: |
          set -e
          xcodebuild -version
          set -o pipefail
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DD \
            CODE_SIGNING_REQUIRED="$CODE_SIGNING_REQUIRED" \
            CODE_SIGNING_ALLOWED="$CODE_SIGNING_ALLOWED" \
            CODE_SIGN_IDENTITY="$CODE_SIGN_IDENTITY" \
            IPHONEOS_DEPLOYMENT_TARGET="$IPHONEOS_DEPLOYMENT_TARGET" \
            CODE_SIGNING_INJECT_BASE_ENTITLEMENTS=NO \
            build | tee build.log
          set +o pipefail
          APP_DIR="build/DD/Build/Products/Release-iphoneos"
          if [ ! -d "$APP_DIR/App.app" ]; then
            echo "=========================================="
            echo "BUILD FAILED. Errors:"
            echo "=========================================="
            grep -nE "error:" build.log | head -30 || true
            echo "--- last 40 lines ---"
            tail -40 build.log
            echo "--- products dir ---"
            ls -R "$APP_DIR" 2>/dev/null || echo "products dir missing"
            exit 1
          fi
          echo "BUILD OK - App.app produced"

      - name: 从 Archive 提取 IPA
        run: |
          set -e
          APP_DIR="build/DD/Build/Products/Release-iphoneos"
          mkdir -p build/ipa/Payload
          cp -R "$APP_DIR/App.app" build/ipa/Payload/
          # 确认音频资源已打进 App
          echo "mp3 inside app:"
          find build/ipa/Payload/App.app -name "*.mp3" | wc -l
          cd build/ipa
          zip -qry ../pindu-star-unsigned.ipa Payload
          cd ..
          echo "--- artifact ---"
          ls -lh pindu-star-unsigned.ipa
          unzip -l pindu-star-unsigned.ipa | tail -3

      - name: 上传 IPA 供下载
        uses: actions/upload-artifact@v4
        with:
          name: pindu-star-ipa
          path: build/pindu-star-unsigned.ipa
          retention-days: 90
          if-no-files-found: error

      - name: 输出提示
        run: |
          echo "::notice title=构建成功::下载 Artifacts 里的 pindu-star-ipa，解压得到 pindu-star-unsigned.ipa，用 Sideloadly 装到 iPhone。"
